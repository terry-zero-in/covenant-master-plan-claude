# Covenant benchmark registry — machine-readable form of 09-BENCHMARK-SYNTHESIS-REGISTRY.md
# Schema per the Dynamic Surface Benchmarking Doctrine §9. Registry is seed-not-whitelist.
# discovered: true marks non-seed candidates found dynamically. role values are the doctrine's limited roles.

selection_policy:
  registry_is_seed_not_whitelist: true
  dynamic_discovery_required_for_tier_b_and_c: true
  fresh_candidates_required_for_tier_b_and_c: 2
  official_sources_first: true
  surface_role_assignment_required: true
  counterexample_required_for_tier_c: true
  universal_pane_limit_prohibited: true
  api_model_is_not_ui_ia: true
  build_before_evidence_gate: prohibited

references:
  linear:
    roles: [interaction, ia]
    use_when: [triage decision grammar, saved views scoping, snooze semantics, palette ranking, settings two-door scoping]
    official_sources: [https://linear.app/docs/triage, https://linear.app/docs/inbox, https://linear.app/docs/custom-views, https://linear.app/docs/filters]
    last_verified: 2026-08-08
  ramp:
    roles: [workflow-state]
    use_when: [intake receipt + unprocessable taxonomy, readiness-gated your-move queues, persistent setup guide, advisor seats]
    official_sources: [https://support.ramp.com/hc/en-us/articles/35659701397395, https://support.ramp.com/hc/en-us/articles/4417421399699]
    last_verified: 2026-08-08
  rossum:
    roles: [ontology, interaction]
    use_when: [queue lifecycle, automation dial with per-field confidence thresholds, validation screen state machine, keyboard confirm flow]
    official_sources: [https://knowledge-base.rossum.ai/docs/guide-to-automation-process-in-rossum, https://knowledge-base.rossum.ai/docs/interactive-bounding-boxes-in-rossum]
    last_verified: 2026-08-08
  instabase:
    roles: [evidence-provenance, interaction]
    use_when: [validation-failure-driven review, draw-a-box re-grounding corrections, auto-revalidation]
    official_sources: [https://docs.instabase.com/automate/review, https://docs.instabase.com/automate/validating-documents]
    last_verified: 2026-08-08
